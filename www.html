<!DOCTYPE html>
<html>
  <head>
    <title>九九乘法表</title>

    <!-- CSS -->
    <style>
      
      td {
        border: 1px solid;
        background: linear-gradient(to bottom, white, lightblue);
        padding: 10px;
      }
    </style>
<h2>資訊三甲 周家丞</h2>
    
    <script>
      
      document.write("<table align='center'>");

      for (let i = 0; i <= 9; i++) {
        document.write("<tr>");

        for (let j = 0; j <= i; j++) {
          document.write("<td>");
          document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
          document.write("</td>");
        }

        document.write("</tr>");
      }

      document.write("</table>");
    </script>
  </head>

  <body>

  </body>
</html>
